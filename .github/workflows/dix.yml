name: Diff Nix configurations

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dix-matrix:
    name: Generate derivation diff matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://cachix.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - id: set-matrix
        name: Generate enabled configuration matrix
        working-directory: head
        run: |
          set -euo pipefail
          echo "matrix=$(nix eval --json '.#githubActions.dix.matrix')" >> "$GITHUB_OUTPUT"

  diff:
    name: Derivation diff ${{ matrix.name }}
    needs: dix-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://cachix.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Diff configuration
        env:
          CONFIG_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/derivation-diff-output"

          case "$CONFIG_NAME" in
            nixosConfiguration-*)
              config_name="${CONFIG_NAME#nixosConfiguration-}"
              config_output=nixosConfigurations
              config_attr="nixosConfigurations.${config_name}.config.system.build.toplevel"
              ;;
            homeConfiguration-*)
              config_name="${CONFIG_NAME#homeConfiguration-}"
              config_output=homeConfigurations
              config_attr="homeConfigurations.${config_name}.activationPackage"
              ;;
            darwinConfiguration-*)
              config_name="${CONFIG_NAME#darwinConfiguration-}"
              config_output=darwinConfigurations
              config_attr="darwinConfigurations.${config_name}.system"
              ;;
            *)
              echo "Unknown configuration: $CONFIG_NAME" >&2
              exit 1
              ;;
          esac

          base_outputs="$(nix flake show --json --all-systems ./base)"
          if ! jq -e --arg output "$config_output" 'has($output)' <<<"$base_outputs" > /dev/null; then
            printf '%s\n' "$CONFIG_NAME was added; there is no previous derivation to diff." | tee "$output_file"
            exit 0
          fi

          base_names="$(nix eval --json "./base#$config_output" --apply builtins.attrNames)"
          if ! jq -e --arg name "$config_name" 'index($name) != null' <<<"$base_names" > /dev/null; then
            printf '%s\n' "$CONFIG_NAME was added; there is no previous derivation to diff." | tee "$output_file"
            exit 0
          fi

          echo "Derivation diff for $CONFIG_NAME"
          set +e
          nix run "github:Mic92/nix-diff-rs/a8c9a1b679bf412f5a9d3707cdb41dba20938c23" -- \
            --depth 1 \
            --color never \
            "./base#$config_attr" "./head#$config_attr" \
            | tee "$output_file"
          statuses=("${PIPESTATUS[@]}")
          nix_diff_status="${statuses[0]}"
          tee_status="${statuses[1]}"
          set -e
          if (( nix_diff_status != 0 )); then
            exit "$nix_diff_status"
          fi
          exit "$tee_status"
      - name: Save derivation diff output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: derivation-diff-output-${{ matrix.name }}
          path: ${{ runner.temp }}/derivation-diff-output
          if-no-files-found: ignore

  comment:
    name: Comment derivation diff output
    if: always()
    needs: diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to update the derivation diff comment
    steps:
      - name: Download derivation diff output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: derivation-diff-output-*
          path: derivation-diff-output
          if-no-artifact-found: ignore
      - name: Prepare derivation diff comment
        id: prepare-comment
        run: |
          set -euo pipefail

          shopt -s nullglob
          outputs=(derivation-diff-output/*/derivation-diff-output)
          has_output=false
          if (( ${#outputs[@]} == 0 )); then
            echo "No derivation diff output to comment."
          else
            comment_file="$RUNNER_TEMP/derivation-diff-comment"
            {
              printf '%s\n\n' '# Nix derivation differences'
              for output in "${outputs[@]}"; do
                artifact_name="${output#derivation-diff-output/}"
                artifact_name="${artifact_name%/derivation-diff-output}"
                config_name="${artifact_name#derivation-diff-output-}"
                printf '<details>\n<summary>%s</summary>\n\n```text\n' "$config_name"
                cat "$output"
                printf '\n```\n</details>\n\n'
              done
            } > "$comment_file"
            has_output=true
          fi
          printf 'has_output=%s\n' "$has_output" >> "$GITHUB_OUTPUT"
      - name: Update derivation diff comment
        if: steps.prepare-comment.outputs.has_output == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: dix
          path: ${{ runner.temp }}/derivation-diff-comment
          skip_unchanged: true
