name: Diff Nix configurations

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dix-matrix:
    name: Generate Dix matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://cachix.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - id: set-matrix
        name: Generate enabled configuration matrix
        working-directory: head
        run: |
          set -euo pipefail
          echo "matrix=$(nix eval --json '.#githubActions.dix.matrix')" >> "$GITHUB_OUTPUT"

  diff:
    name: Diff ${{ matrix.name }}
    needs: dix-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://cachix.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Diff configuration
        env:
          CONFIG_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/dix-output"

          case "$CONFIG_NAME" in
            nixosConfiguration-*)
              config_name="${CONFIG_NAME#nixosConfiguration-}"
              config_output=nixosConfigurations
              config_attr="nixosConfigurations.${config_name}.config.system.build.toplevel"
              ;;
            homeConfiguration-*)
              config_name="${CONFIG_NAME#homeConfiguration-}"
              config_output=homeConfigurations
              config_attr="homeConfigurations.${config_name}.activationPackage"
              ;;
            darwinConfiguration-*)
              config_name="${CONFIG_NAME#darwinConfiguration-}"
              config_output=darwinConfigurations
              config_attr="darwinConfigurations.${config_name}.system"
              ;;
            *)
              echo "Unknown Dix configuration: $CONFIG_NAME" >&2
              exit 1
              ;;
          esac

          base_outputs="$(nix flake show --json --all-systems ./base)"
          if ! jq -e --arg output "$config_output" 'has($output)' <<<"$base_outputs" > /dev/null; then
            printf '%s\n' "$CONFIG_NAME was added; there is no previous closure to diff." | tee "$output_file"
            exit 0
          fi

          base_names="$(nix eval --json "./base#$config_output" --apply builtins.attrNames)"
          if ! jq -e --arg name "$config_name" 'index($name) != null' <<<"$base_names" > /dev/null; then
            printf '%s\n' "$CONFIG_NAME was added; there is no previous closure to diff." | tee "$output_file"
            exit 0
          fi

          profiles="$(mktemp -d)"
          trap 'rm -rf "$profiles"' EXIT
          old_profile="$profiles/old"
          new_profile="$profiles/new"

          echo "Building $CONFIG_NAME from the base revision"
          nix build -L --profile "$old_profile" "./base#$config_attr"
          echo "Building $CONFIG_NAME from the pull request revision"
          nix build -L --profile "$new_profile" "./head#$config_attr"

          echo "Diff for $CONFIG_NAME"
          set +e
          nix run "github:manic-systems/dix/857739fe62bd8ae8e4a8078b983ca9b5a7bd075b#dix" -- \
            --force-correctness \
            --color never \
            "$old_profile" "$new_profile" \
            | sed '/^<<< /d; /^>>> /d' | tee "$output_file"
          statuses=("${PIPESTATUS[@]}")
          dix_status="${statuses[0]}"
          filter_status="${statuses[1]}"
          tee_status="${statuses[2]}"
          set -e
          if (( dix_status != 0 )); then
            exit "$dix_status"
          fi
          if (( filter_status != 0 )); then
            exit "$filter_status"
          fi
          exit "$tee_status"
      - name: Save Dix output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dix-output-${{ matrix.name }}
          path: ${{ runner.temp }}/dix-output
          if-no-files-found: ignore

  comment:
    name: Comment Dix output
    if: always()
    needs: diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to update the Dix comment
    steps:
      - name: Download Dix output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dix-output-*
          path: dix-output
          if-no-artifact-found: ignore
      - name: Prepare Dix comment
        id: prepare-comment
        run: |
          set -euo pipefail

          shopt -s nullglob
          outputs=(dix-output/*/dix-output)
          has_output=false
          if (( ${#outputs[@]} == 0 )); then
            echo "No Dix output to comment."
          else
            comment_file="$RUNNER_TEMP/dix-comment"
            {
              printf '%s\n\n' '# Dix configuration differences'
              for output in "${outputs[@]}"; do
                artifact_name="${output#dix-output/}"
                artifact_name="${artifact_name%/dix-output}"
                config_name="${artifact_name#dix-output-}"
                printf '<details>\n<summary>%s</summary>\n\n```text\n' "$config_name"
                cat "$output"
                printf '\n```\n</details>\n\n'
              done
            } > "$comment_file"
            has_output=true
          fi
          printf 'has_output=%s\n' "$has_output" >> "$GITHUB_OUTPUT"
      - name: Update Dix comment
        if: steps.prepare-comment.outputs.has_output == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: dix
          path: ${{ runner.temp }}/dix-comment
          skip_unchanged: true
