name: Evaluate Nix flake

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate all flake outputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://cachix.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Check standard flake outputs
        run: nix flake check --all-systems --no-build --keep-going
      - name: Evaluate Darwin configurations
        run: >-
          nix eval --json .#darwinConfigurations
          --apply 'builtins.mapAttrs (_: host: host.config.system.build.toplevel.drvPath)'
          > /dev/null
      - name: Evaluate custom flake outputs
        run: |
          set -euo pipefail
          nix eval --json .#cloudflareHosts > /dev/null
          nix eval --json .#deploy > /dev/null
          nix eval --json .#githubActions > /dev/null
