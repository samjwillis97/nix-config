[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatcharr"
version = "0.29.0"
description = "Dispatcharr - Stream dispatching and management"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"

[project.scripts]
dispatcharr = "dispatcharr.manage:main"

[tool.setuptools]
py-modules = ["version"]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "dispatcharr*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.png", "*.ico", "*.svg"]
